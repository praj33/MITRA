services:
  - type: web
    name: mitra-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: mitra_production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_STORE_MODE
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: MONGODB_SOCKET_TIMEOUT_MS
        value: "5000"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: META_VERIFY_TOKEN
        value: mitra_verify_token
      - key: INBOUND_MEDIATION_ENABLED
        value: "1"
      - key: OUTBOUND_SAFETY_GATE_ENABLED
        value: "1"
      - key: REMINDER_SCHEDULER_ENABLED
        value: "0"
      - key: EXECUTION_SIMULATION
        value: "0"
      - key: UNIGURU_URL
        value: https://uniguru-v2.onrender.com/new_query
      - key: API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://mitra-t42.vercel.app
      - key: UNIGURU_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
